# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-s7comm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-s7comm"
description = "S7comm transport: Siemens S7 over ISO-on-TCP — setup communication, read and write of data blocks, inputs, outputs and flags by address — a Location reads or writes a PLC area as a Stream. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). S7 rides on ISO transport, so the cotp technology is
# the carrier — a sibling, depended on the way a Technology may depend on one
# already on main.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# TODO land: git = "https://github.com/IlleNilsson/xmip-core-transport-cotp", branch = "main"
cotp = { package = "xmip-core-transport-cotp", path = "../cotp" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
